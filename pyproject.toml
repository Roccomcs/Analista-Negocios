[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cadmo-analista-negocios"
version = "0.1.0"
description = "Investigación de negocios con fuentes públicas, SQLite, Ollama y Excel. Sin envíos."
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.13,<5", "pydantic>=2.10,<3", "filelock>=3.16,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
analista = "analista.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

